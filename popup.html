<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Intent-Adaptive Screen Reader</title>
  <style>
    body {
      width: 340px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 14px;
      background: #10131a;
      color: #eaecef;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px 0;
      color: #fff;
    }
    .intent-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: #2f6fed;
      color: white;
      margin-bottom: 10px;
    }
    .intent-badge.unknown { background: #555; }
    .confidence {
      font-size: 11px;
      color: #9aa1ac;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 6px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    #analyzeBtn { background: #23262f; color: #eaecef; }
    #speakBtn { background: #2f6fed; color: white; }
    #stopBtn { background: #b23b3b; color: white; }
    #jumpBtn { background: #1e6b45; color: white; display: none; }
    .blocks {
      margin-top: 10px;
      font-size: 12px;
      max-height: 220px;
      overflow-y: auto;
    }
    .block {
      padding: 6px 8px;
      border-radius: 5px;
      margin-bottom: 4px;
      background: #1a1e28;
      border-left: 3px solid #2f6fed;
    }
    .block.active {
      background: #2f6fed33;
      border-left-color: #4c8cff;
    }
    .block .label {
      font-weight: 700;
      color: #8fb4ff;
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .block .text {
      color: #d5d8de;
    }
    .empty {
      font-size: 12px;
      color: #777;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Intent-Adaptive Screen Reader</h1>
  <div id="intentArea"></div>
  <button id="analyzeBtn">Analyze this page</button>
  <button id="jumpBtn">Jump to best match &amp; read</button>
  <button id="speakBtn">Read (task-prioritized order)</button>
  <button id="stopBtn">Stop</button>
  <div id="blocksArea" class="blocks"></div>
  <script src="popup.js"></script>
</body>
</html>
